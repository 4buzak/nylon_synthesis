<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나일론 합성 애니메이션</title>
<style>
  /* Layout: 16:9 animated stage, caption panel, control row — same look as the 화학전지 animation */
  :root {
    --ol: #2b2d42;
    --bg: #fdf8ec;
    --panel: #ffffff;
    --accent: #e07a3c;
    --blue: #3a86ff;
    --muted: #5c6270;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ol);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    word-break: keep-all;
  }
  .app {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding-block: 16px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg);
  }
  .stage {
    width: min(100%, calc((100vh - 230px) * 16 / 9));
    min-width: 280px;
    max-width: 100%;
    border: 4px solid var(--ol);
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(#e6f4ff, #fffaf0 75%);
    box-shadow: 0 8px 0 var(--ol);
  }
  .stage svg { display: block; width: 100%; height: auto; }

  .caption {
    width: min(100%, calc((100vh - 230px) * 16 / 9));
    min-width: 280px; max-width: 100%;
    margin-top: 22px;
    background: var(--panel);
    border: 3px solid var(--ol);
    border-radius: 16px;
    padding: 14px 18px;
    min-height: 96px;
  }
  .caption .chip {
    display: inline-block;
    background: var(--accent); color: #fff;
    font-weight: 800; font-size: 14px;
    padding: 3px 12px; border-radius: 999px;
    margin-bottom: 6px;
  }
  .caption .title { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .caption .text { font-size: 17px; line-height: 1.6; margin: 0; color: var(--muted); }

  .controls {
    width: min(100%, calc((100vh - 230px) * 16 / 9));
    min-width: 280px; max-width: 100%;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    margin-top: 14px;
  }
  .btn {
    font: inherit; font-weight: 800; font-size: 16px;
    border: 3px solid var(--ol); border-radius: 12px;
    background: #fff; color: var(--ol);
    padding: 8px 16px; cursor: pointer;
    box-shadow: 0 4px 0 var(--ol);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
  .btn:focus-visible, .dot:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .btn.primary { background: #ffd23f; }
  .btn.on { background: #8ee3c8; }
  .btn:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 6px; margin: 0 6px; flex-wrap: wrap; justify-content: center; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--ol); background: #fff; cursor: pointer; padding: 0;
  }
  .dot.active { background: var(--accent); }
  .foot { margin-top: 14px; font-size: 14px; color: var(--muted); text-align: center; }

  /* ---------- SVG styling ---------- */
  svg text { font-family: inherit; font-weight: 800; fill: var(--ol); }
  .lbl { font-size: 18px; text-anchor: middle; }
  .big { paint-order: stroke; stroke: #fff; stroke-width: 8px; stroke-linejoin: round; }
  .chem { font-family: 'Times New Roman', serif !important; }

  .scene { display: none; }
  .scene.active { display: inline; }

  .pop, .pulse, .spin { transform-box: fill-box; transform-origin: center; }
  .pour { transform-box: fill-box; transform-origin: var(--o, 100% 0%); }

  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes drop {
    0% { transform: translateY(var(--dy)); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rub { from { transform: translateX(0); } to { transform: translateX(var(--dx)); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes pour { 0% { transform: rotate(0); } 25%, 75% { transform: rotate(var(--r)); } 100% { transform: rotate(0); } }
  @keyframes rise {
    0% { transform: translate(0, 0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy2)); opacity: 0; }
  }
  @keyframes fall {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(40px); opacity: 0; }
  }

  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }

  .play .pop  { animation: pop .55s cubic-bezier(.34,1.56,.64,1) var(--d, 0s) both; }
  .play .fi   { animation: fadeIn .6s ease var(--d, 0s) both; }
  .play .fo   { animation: fadeOut .8s ease var(--d, 0s) forwards; }
  .play .drop { animation: drop 1s cubic-bezier(.45,0,.35,1.15) var(--d, 0s) both; }
  .play .draw { animation: draw 1s ease var(--d, 0s) forwards; }
  .play .rub  { animation: rub .45s ease-in-out var(--d, 0s) var(--n, 4) alternate both; }
  .play .bob  { animation: bob 2.2s ease-in-out var(--d, 0s) infinite; }
  .play .pulse{ animation: pulse 1.2s ease-in-out var(--d, 0s) infinite; }
  .play .glow { animation: glow 1.3s ease-in-out var(--d, 0s) infinite; }
  .play .pour { animation: pour 3s ease-in-out var(--d, 0s) both; }
  .play .rise { animation: rise 2s ease-out var(--d, 0s) infinite both; }
  .play .fall { animation: fall .9s ease-in var(--d, 0s) infinite both; }
  .play .drip { animation: fall .6s ease-in var(--d, 0s) 3 both; }
  .swirl { transform-box: fill-box; transform-origin: 50% 100%; }
  .spinA, .spinB { transform-box: fill-box; transform-origin: center; }
  @keyframes spinX { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.12); } }
  .play .spinA { animation: spinX .5s linear infinite; }
  .play .spinB { animation: spinX .5s linear -.25s infinite; }
  .grow { transform-box: fill-box; transform-origin: 50% 0%; }
  @keyframes swirl { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes dripN { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(var(--fy, 34px)); opacity: 0; } }
  .play .swirl { animation: swirl .9s ease-in-out var(--d, 0s) var(--n, 3) both; }
  .play .grow  { animation: grow var(--t, 5s) linear var(--d, 0s) both; }
  .play .drips { animation: dripN var(--p, .6s) ease-in var(--d, 0s) var(--n, 6) both; }

  @media (max-width: 600px) {
    .caption .title { font-size: 19px; }
    .caption .text { font-size: 15.5px; }
    .btn { font-size: 14px; padding: 7px 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .play * { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }

  /* 나일론 장면용 추가 애니메이션 */
  .growUp { transform-box: fill-box; transform-origin: 50% 100%; }
  .play .growUp { animation: grow var(--t, 5s) ease-out var(--d, 0s) both; }
  .play .pourS { animation: pour var(--t, 6s) ease-in-out var(--d, 0s) both; }
  .pourS { transform-box: fill-box; transform-origin: var(--o, 0% 0%); }
  .drawS { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .play .drawS { animation: draw var(--t, 2s) linear var(--d, 0s) forwards; }
  @keyframes pick { 0% { transform: translateY(-220px); opacity: 0; } 10% { opacity: 1; } 30%, 45% { transform: translateY(0); } 100% { transform: translateY(-262px); } }
  .play .pick { animation: pick 4s linear var(--d, 0s) both; }
  @keyframes wash {
    0% { transform: translate(0, -90px); } 15%, 35% { transform: translate(0, 0); }
    50% { transform: translate(0, -90px); } 65% { transform: translate(220px, -90px); }
    80%, 100% { transform: translate(220px, 0); }
  }
  .play .wash { animation: wash 7s ease-in-out var(--d, 0s) both; }
  .rot { transform-box: fill-box; transform-origin: center; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .play .rot { animation: rot 1.6s linear var(--d, 0s) infinite; }
  @keyframes flow { to { stroke-dashoffset: -36; } }
  .play .flow { animation: flow .8s linear infinite; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="stage">
    <svg id="svg" viewBox="0 0 800 450" role="img" aria-label="나일론 합성(계면 중합) 실험 과정 애니메이션">
      <defs>
        <marker id="arrowB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0 0 L10 5 L0 10z" fill="#3a86ff"/>
        </marker>
      </defs>
    </svg>
  </div>

  <div class="caption" aria-live="polite">
    <span class="chip" id="capChip"></span>
    <p class="title" id="capTitle"></p>
    <p class="text" id="capText"></p>
  </div>

  <div class="controls">
    <button class="btn" id="prev">◀ 이전</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="replay">⟳ 다시보기</button>
    <button class="btn primary" id="next">다음 ▶</button>
    <button class="btn" id="auto">▶ 자동재생</button>
    <button class="btn" id="fs">⛶ 전체화면</button>
  </div>

  <div class="foot">키보드 ← → 로 넘길 수 있어요</div>
</div>

<script>
(() => {
  const OL = '#2b2d42';
  const ORANGE = '#e07a3c';
  const RED = '#e63946';
  // ----- 용액 색 (실제로는 모두 무색 — 구분을 위해 옅게 색을 넣음) -----
  const DCM = '#dde6f8';        // 염화 세바코일 / DCM 용액 (아래층)
  const AQ = '#e4f4e7';         // 헥사메틸렌다이아민 + NaOH 수용액 (위층)
  const SC = '#f5ebb8';         // 염화 세바코일 원액 (연노란 액체)
  const HMDA = '#f4efe0';       // 헥사메틸렌다이아민
  const WASH = '#eef0f6';       // 아세톤 : 물 = 1 : 1
  const WATER = '#dcefff';      // 물
  const NYL_EDGE = '#bdb6a3';   // 나일론 테두리

  const st = (d, extra = '') => `style="--d:${d}s;${extra}"`;

  const table = () =>
    `<rect x="0" y="398" width="800" height="52" fill="#dcb583"/>
     <rect x="0" y="398" width="800" height="7" fill="#b98a57"/>`;

  const pill = (x, y, w, h, fill, text, fs = 20, txtFill = OL) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${OL}" stroke-width="4"/>
     <text x="${x + w / 2}" y="${y + h / 2 + fs * .36}" font-size="${fs}" text-anchor="middle" style="fill:${txtFill}">${text}</text>`;

  const box = (x, y, w, h, lines, stroke = OL) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#fff" stroke="${stroke}" stroke-width="4"/>
     ${lines.map(([t, fs, col, cls], i) => `<text x="${x + w / 2}" y="${y + 34 + i * 30}" font-size="${fs}" text-anchor="middle" ${cls ? `class="${cls}"` : ''} style="fill:${col || OL}">${t}</text>`).join('')}`;

  const sparkle = (x, y, d, s = 1) =>
    `<g transform="translate(${x} ${y}) scale(${s})"><path class="pop" ${st(d)} d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4Z" fill="#fff" stroke="#ffb703" stroke-width="2.5" stroke-linejoin="round"/></g>`;

  const arrow = (d, path) =>
    `<g class="pop" ${st(d)}><path d="${path}" fill="none" stroke="#3a86ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowB)"/></g>`;

  // ----- 비커 (local: 입구 y=0, 바닥 y=h, 폭 w) -----
  const beaker = (w, h, inner = '', label = '') => `
    <path d="M2 0 V${h - 10} Q2 ${h} 12 ${h} H${w - 12} Q${w - 2} ${h} ${w - 2} ${h - 10} V0 Z" fill="#fff" opacity=".5"/>
    ${inner}
    <path d="M-6 -6 Q2 -3 2 8 V${h - 10} Q2 ${h} 12 ${h} H${w - 12} Q${w - 2} ${h} ${w - 2} ${h - 10} V0" fill="none" stroke="${OL}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    ${[.35, .5, .65, .8].map((f) => `<path d="M2 ${h * f} H${f === .5 || f === .8 ? 18 : 12}" stroke="${OL}" stroke-width="2" opacity=".45"/>`).join('')}
    <path d="M${w - 16} ${h * .2} V${h * .7}" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    ${label ? `<text x="${w / 2}" y="24" font-size="13" text-anchor="middle" style="fill:#5c6270">${label}</text>` : ''}`;
  const bLiq = (w, h, top, col, a = '', op = .95) =>
    `<g ${a}><path d="M5 ${top} V${h - 10} Q5 ${h - 3} 13 ${h - 3} H${w - 13} Q${w - 5} ${h - 3} ${w - 5} ${h - 10} V${top} Z" fill="${col}" opacity="${op}"/>
      <path d="M7 ${top} H${w - 7}" stroke="#fff" stroke-width="3" opacity=".6"/></g>`;
  const bk = (x, y, w, h, inner = '', label = '', cls = '', d = 0, extra = '') =>
    `<g transform="translate(${x} ${y})"><g class="${cls}" ${st(d, extra)}>${beaker(w, h, inner, label)}</g></g>`;

  // 나일론 필름(계면) / 끈 / 다발
  const FILM_D = 'M5 112 Q35 106 65 112 T125 112';
  const film = (a = '') =>
    `<g ${a}><path d="${FILM_D}" fill="none" stroke="${NYL_EDGE}" stroke-width="7" stroke-linecap="round"/>
       <path d="${FILM_D}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>`;
  // 100 mL 비커 (130 x 150) 안의 두 층: DCM 아래(112~), 수용액 위(74~112)
  const layered = (filmA = '', aqA = '') =>
    `${bLiq(130, 150, 112, DCM)}
     <g ${aqA}><rect x="5" y="74" width="120" height="38" fill="${AQ}" opacity=".95"/>
       <path d="M7 74 H123" stroke="#fff" stroke-width="3" opacity=".6"/></g>
     ${film(filmA)}`;
  const strand = (d, cls = '', a = '') => {
    const pl = cls ? 'pathLength="1"' : '';
    return `<path class="${cls}" ${a} ${pl} d="${d}" fill="none" stroke="${NYL_EDGE}" stroke-width="7" stroke-linecap="round"/>
     <path class="${cls}" ${a} ${pl} d="${d}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  };
  const rope = (x, y1, y2, cls = '', a = '') => strand(`M${x} ${y1} V${y2}`, cls, a);
  const flow = (x, y1, y2) =>
    `<path class="flow" d="M${x} ${y1} V${y2}" stroke="#c9c2ad" stroke-width="2" stroke-dasharray="5 13" fill="none"/>`;
  const rod = (x1, x2, y) =>
    `<rect x="${x1}" y="${y - 6}" width="${x2 - x1}" height="12" rx="6" fill="#eaf4fb" stroke="${OL}" stroke-width="3"/>
     <path d="M${x1 + 10} ${y - 2} H${x2 - 10}" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;
  const coil = (cx, y, d) =>
    `<g class="pop" ${st(d)}><ellipse cx="${cx}" cy="${y}" rx="6" ry="11" fill="none" stroke="${NYL_EDGE}" stroke-width="6.5"/>
       <ellipse cx="${cx}" cy="${y}" rx="6" ry="11" fill="none" stroke="#fff" stroke-width="3.5"/></g>`;
  const rotArrow = (cx, cy, d, r = 18) =>
    `<g class="rot" ${st(d)}><path d="M${cx} ${cy - r} A${r} ${r} 0 1 1 ${cx - r} ${cy}" fill="none" stroke="#3a86ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowB)"/></g>`;
  const bundleFlat = () => [
    'M-34 -4 q8 -10 17 0 t17 0 t17 0 t17 0',
    'M-30 -11 q8 -10 15 0 t15 0 t15 0 t15 0',
    'M-24 -18 q6 -9 12 0 t12 0 t12 0 t12 0'].map((d) => strand(d)).join('');
  const bundleHang = () => [
    'M0 0 q-7 10 0 20 t0 22',
    'M-3 2 q7 10 0 20 t-3 18',
    'M3 2 q-6 12 2 22 t-2 16'].map((d) => strand(d)).join('');

  const tweezers = `
    <path d="M-1.5 0 L-10 -86 Q-7 -93 -2.5 -89 L1 -4 Z" fill="#dfe4e9" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M1.5 0 L10 -86 Q7 -93 2.5 -89 L-1 -4 Z" fill="#c9d1d9" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-7" y="-60" width="14" height="5" rx="2" fill="#9aa3ad" stroke="${OL}" stroke-width="1.5"/>`;

  // 눈금 피펫 (끝 = (0,0), 위로 200)
  const pipette = (liq) => `
    <rect x="-9" y="-200" width="18" height="34" rx="8" fill="#ff8fa3" stroke="${OL}" stroke-width="3"/>
    <rect x="-4.5" y="-170" width="9" height="150" fill="#fff" stroke="${OL}" stroke-width="2.5"/>
    <rect x="-2.5" y="-112" width="5" height="90" fill="${liq}"/>
    ${Array.from({ length: 7 }, (_, i) => `<path d="M4.5 ${-150 + i * 18} H${i % 2 ? 0 : -2}" stroke="${OL}" stroke-width="1.5" opacity=".6"/>`).join('')}
    <path d="M-4.5 -20 L-1 0 H1 L4.5 -20" fill="#fff" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>`;

  const reagentBottle = (cap, label, liqCol, fs = 9) => `
    <rect x="-12" y="-46" width="24" height="10" rx="3" fill="${cap}" stroke="${OL}" stroke-width="3"/>
    <rect x="-9" y="-36" width="18" height="16" fill="#f2f8ff" stroke="${OL}" stroke-width="3"/>
    <rect x="-24" y="-22" width="48" height="62" rx="10" fill="#f2f8ff" stroke="${OL}" stroke-width="3"/>
    <rect x="-20" y="10" width="40" height="27" rx="7" fill="${liqCol}"/>
    <rect x="-20" y="-12" width="40" height="18" rx="3" fill="#fff" stroke="${OL}" stroke-width="2"/>
    <text y="1" font-size="${fs}" text-anchor="middle" class="chem">${label}</text>`;

  const balance = (x, y, from, to, d) => `
    <rect x="${x + 122}" y="${y - 20}" width="16" height="22" fill="#9aa3ad" stroke="${OL}" stroke-width="3"/>
    <rect x="${x}" y="${y}" width="260" height="80" rx="12" fill="#e3e7ec" stroke="${OL}" stroke-width="4"/>
    <rect x="${x + 20}" y="${y + 20}" width="130" height="40" rx="6" fill="#163828" stroke="${OL}" stroke-width="3"/>
    <g class="fo" ${st(d)}><text x="${x + 140}" y="${y + 48}" font-size="22" text-anchor="end" style="fill:#7dffa6;font-family:'Courier New',monospace">${from}</text></g>
    <g class="fi" ${st(d + .2)}><text x="${x + 140}" y="${y + 48}" font-size="22" text-anchor="end" style="fill:#7dffa6;font-family:'Courier New',monospace">${to}</text></g>
    <circle cx="${x + 190}" cy="${y + 40}" r="10" fill="#fff" stroke="${OL}" stroke-width="3"/>
    <circle cx="${x + 226}" cy="${y + 40}" r="10" fill="#fff" stroke="${OL}" stroke-width="3"/>
    <rect x="${x + 50}" y="${y - 28}" width="160" height="10" rx="5" fill="#c9d1d9" stroke="${OL}" stroke-width="3"/>`;

  const goggles = `
    <path d="M-58 -2 Q0 -30 58 -2" fill="none" stroke="${OL}" stroke-width="6"/>
    <rect x="-52" y="-24" width="46" height="40" rx="15" fill="#bde0fe" stroke="${OL}" stroke-width="4"/>
    <rect x="6" y="-24" width="46" height="40" rx="15" fill="#bde0fe" stroke="${OL}" stroke-width="4"/>
    <rect x="-8" y="-10" width="16" height="9" fill="${OL}"/>
    <path d="M-42 -14 L-30 -2" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  const glove = () => `<g>
      <rect x="-24" y="-38" width="11" height="34" rx="5.5" fill="#7fd1ae" stroke="${OL}" stroke-width="3"/>
      <rect x="-12" y="-46" width="11" height="42" rx="5.5" fill="#7fd1ae" stroke="${OL}" stroke-width="3"/>
      <rect x="0" y="-44" width="11" height="40" rx="5.5" fill="#7fd1ae" stroke="${OL}" stroke-width="3"/>
      <rect x="12" y="-36" width="11" height="32" rx="5.5" fill="#7fd1ae" stroke="${OL}" stroke-width="3"/>
      <ellipse cx="-30" cy="6" rx="8" ry="18" transform="rotate(-35 -30 6)" fill="#7fd1ae" stroke="${OL}" stroke-width="3"/>
      <rect x="-25" y="-12" width="49" height="54" rx="14" fill="#7fd1ae" stroke="${OL}" stroke-width="3"/>
    </g>`;
  const cross = (s = 40) =>
    `<path d="M${-s} ${-s} L${s} ${s} M${s} ${-s} L${-s} ${s}" stroke="${RED}" stroke-width="8" stroke-linecap="round" opacity=".9"/>`;

      <text x="400" y="102" font-size="19" text-anchor="middle">염화 세바코일 : 헥사메틸렌다이아민 = 1 : 1 로 반응</text>
      <text x="400" y="134" font-size="18" text-anchor="middle" style="fill:${ORANGE}">∴ 적은 쪽, 염화 세바코일이 한계 반응물</text>
    </g>
    ${[
      ['염화 세바코일: 1 mL × 1.12 g/mL ÷ 239.1 g/mol = 4.69 mmol', 1.2, '#bde0fe'],
      ['헥사메틸렌다이아민: 1.1 mL × 0.84 g/mL ÷ 116.2 g/mol ≈ 7.95 mmol', 1.8, '#e4f4e7'],
      ['이론 수득량 = 4.69 mmol × 282.4 g/mol ≈ 1.32 g', 2.4, '#bde0fe'],
      ['수득률(%) = 얻은 질량 ÷ 1.32 g × 100', 3.0, '#ffd23f'],
    ].map(([t, d, c], i) => `<g class="pop" ${st(d)}>${pill(60, 162 + i * 54, 680, 44, c, t, 17)}</g>`).join('')}
    <g class="pop" ${st(3.8)}>
      <rect x="60" y="380" width="680" height="58" rx="14" fill="#fff" stroke="${OL}" stroke-width="3.5" stroke-dasharray="8 6"/>
      <text x="400" y="404" font-size="15" text-anchor="middle">반복 단위 C₁₆H₃₀N₂O₂ = 282.4 g/mol</text>
      <text x="400" y="427" font-size="14" text-anchor="middle" style="fill:#5c6270">뽑아낸 끈만 얻으므로 실제 수득률은 100 %보다 낮아요</text>
    </g>`;

  // ---------- Scene 11: safety ----------
  const sCard = (x, d, label, note, art) =>
    `<g class="pop" ${st(d)}>
       <rect x="${x}" y="96" width="170" height="246" rx="18" fill="#fff" stroke="${OL}" stroke-width="4"/>
       <g transform="translate(${x + 85} 190)">${art}</g>
       <text x="${x + 85}" y="296" class="lbl" font-size="19">${label}</text>
       <text x="${x + 85}" y="320" class="lbl" font-size="13" style="fill:#5c6270">${note}</text>
     </g>`;
  const s11 = `
    <text x="400" y="62" font-size="32" text-anchor="middle" class="big">안전 수칙</text>
    ${sCard(30, .1, '보안경 · 장갑', '실험 내내 착용', `<g transform="translate(0 -22) scale(.9)">${goggles}</g><g transform="translate(0 40) scale(.6)">${glove()}</g>`)}
    ${sCard(220, .5, '환기 · 증기 주의', '들이마시지 않기', `
      <g transform="translate(-32 -14) scale(.5)">${beaker(130, 150, layered())}</g>
      ${[-16, 0, 16].map((x, i) => `<path class="rise" ${st(i * .4, '--dx:0px;--dy2:-24px')} d="M${x} -24 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>`).join('')}`)}
    ${sCard(410, .9, '맨손 금지', '장갑도 스며들어요', `
      <g transform="scale(.8)">${glove()}</g>
      <g class="pulse" ${st(1.4)}>${cross(32)}</g>`)}
    ${sCard(600, 1.3, '폐액 분리', '할로젠 폐액통', `
      <rect x="-14" y="-50" width="28" height="12" rx="3" fill="#ffd23f" stroke="${OL}" stroke-width="3"/>
      <rect x="-32" y="-40" width="64" height="86" rx="12" fill="#eef2f5" stroke="${OL}" stroke-width="4"/>
      <rect x="-28" y="4" width="56" height="38" rx="8" fill="${DCM}"/>
      <rect x="-24" y="-28" width="48" height="24" rx="4" fill="#fff" stroke="${OL}" stroke-width="2"/>
      <text y="-11" font-size="11" text-anchor="middle">DCM 폐액</text>`)}
    <g class="pop" ${st(2.0)}>${pill(120, 362, 560, 54, '#ff6b6b', '씻은 뒤에도 DCM이 남아 있으면 손으로 만지지 않아요!', 18, '#fff')}</g>`;

  // dur: 장면별 자동재생 시간(초). 숫자만 바꾸면 장면마다 따로 조절됩니다.
  const scenes = [
    { html: s0, chip: '시작', title: '나일론 합성', text: '헥사메틸렌다이아민 수용액과 염화 세바코일 DCM 용액이 만나는 경계면에서 나일론 필름이 생기는 계면 중합을 이용해, 나일론 끈을 뽑아 올립니다.', dur: 3 },
    { html: s1, chip: '준비', title: '준비물', text: '염화 세바코일 1 mL, DCM 20 mL, 헥사메틸렌다이아민 1.1 mL, 0.2 M NaOH 수용액 20 mL, 세척용 아세톤:물(1:1)과 100 mL·50 mL 비커, 눈금 피펫, 핀셋, 유리 막대를 준비합니다. 보안경과 장갑을 착용합니다.', dur: 3 },
    { html: s2, chip: 'STEP 1', title: '염화 세바코일 녹이기', text: '염화 세바코일 1 mL를 눈금 피펫으로 취하여 DCM 20 mL가 들어 있는 100 mL 비커에 넣어 녹입니다. 염화 세바코일은 자극성이 강하므로 증기를 들이마시지 않도록 주의하고, 실험실을 충분히 환기합니다.', dur: 15 },
    { html: s3, chip: 'STEP 2', title: '헥사메틸렌다이아민 수용액 만들기', text: '50 mL 비커에 0.2 M NaOH 수용액 20 mL와 헥사메틸렌다이아민 1.1 mL를 넣고 섞습니다. NaOH는 중합 반응에서 생기는 HCl을 중화합니다.', dur: 15 },
    { html: s4, chip: 'STEP 3', title: '기벽을 따라 서서히 붓기', text: '염화 세바코일 용액이 든 100 mL 비커는 실험대에 내려놓은 채로 두고, 밀도가 가벼운 헥사메틸렌다이아민 수용액을 기벽을 따라 서서히 부어 위층을 만듭니다. 너무 급하게 부으면 계면이 잘 생기지 않아 나일론 끈을 얻을 수 없습니다.', dur: 15 },
    { html: s5, chip: 'STEP 4', title: '필름 끌어올려 감기', text: '계면에 생긴 나일론 필름을 핀셋으로 조심스럽게 집어 올려 유리 막대에 감고, 유리 막대를 돌려 필름을 비커에서 끌어올려 나일론 끈을 얻습니다.', dur: 15 },
    { html: s6, chip: 'STEP 5', title: '끝까지 감아올리기', text: '중합체가 더 이상 생기지 않을 때까지 유리 막대로 나일론 끈을 감아올립니다. 유리 막대가 미끄러워 잘 감기지 않으면 핀셋으로만 뽑아 올려도 됩니다. 나일론 끈에는 반응하지 않은 출발 물질이 묻어 있으므로 씻기 전에는 손으로 만지지 않습니다.', dur: 15 },
    { html: s7, chip: 'STEP 6', title: '나일론 끈 씻기', text: '나일론 끈을 아세톤과 물 1:1 용액으로 씻은 뒤 다시 물로 충분히 씻습니다. 씻은 뒤에도 DCM 용액이 남아 있으면 장갑을 꼈더라도 스며들어 화학적 화상을 일으키므로 손으로 만지지 않습니다.', dur: 15 },
    { html: s8, chip: 'STEP 7', title: '말리고 질량 재기', text: '씻은 나일론을 80 ℃ 오븐에서 말린 다음, 얻은 중합체의 질량을 재어 기록합니다.', dur: 15 },
    { html: s9, chip: '원리', title: '계면 중합', text: '아래층(DCM)의 염화 세바코일과 위층(수용액)의 헥사메틸렌다이아민이 두 층의 경계면에서만 만나 아마이드 결합을 만들고 HCl이 빠져나가는 축합 중합이 일어납니다. 필름을 걷어내면 새 계면에서 다시 반응해 끈이 계속 이어집니다.', dur: 8 },
    { html: s10, chip: '계산', title: '이론 수득량과 수득률', text: '염화 세바코일이 한계 반응물입니다. 반복 단위의 몰질량(282.4 g/mol)으로 이론 수득량을 구하고, 얻은 질량과 비교해 수득률을 계산합니다.', dur: 8 },
    { html: s11, chip: '안전', title: '안전 수칙', text: '보안경과 장갑을 착용하고 염화 세바코일과 DCM의 증기를 들이마시지 않도록 실험실을 충분히 환기합니다. DCM이 남아 있는 나일론은 장갑을 껴도 스며들어 화학적 화상을 입을 수 있으므로 손으로 만지지 않고, DCM 폐액은 할로젠 폐액통에 따로 버립니다.', dur: 3.5 },
  ];

  const svg = document.getElementById('svg');
  const NS = 'http://www.w3.org/2000/svg';
  const els = scenes.map((s) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'scene');
    g.innerHTML = s.html;
    svg.appendChild(g);
    return g;
  });

  const dotsBox = document.getElementById('dots');
  scenes.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'dot';
    b.setAttribute('aria-label', `${i + 1}번 장면: ${s.title}`);
    b.onclick = () => go(i);
    dotsBox.appendChild(b);
  });

  let cur = 0, autoTimer = null, autoOn = false;

  function go(i) {
    i = Math.max(0, Math.min(scenes.length - 1, i));
    els.forEach(g => g.classList.remove('active', 'play'));
    cur = i;
    const g = els[i];
    g.classList.add('active');
    void g.getBoundingClientRect();
    g.classList.add('play');
    const s = scenes[i];
    document.getElementById('capChip').textContent = s.chip;
    document.getElementById('capTitle').textContent = s.title;
    document.getElementById('capText').textContent = s.text;
    [...dotsBox.children].forEach((d, k) => d.classList.toggle('active', k === i));
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === scenes.length - 1;
    scheduleAuto();
  }

  function scheduleAuto() {
    clearTimeout(autoTimer);
    if (!autoOn) return;
    autoTimer = setTimeout(() => go((cur + 1) % scenes.length), scenes[cur].dur * 1000);
  }
  function setAuto(on) {
    autoOn = on;
    const b = document.getElementById('auto');
    b.classList.toggle('on', on);
    b.textContent = on ? '⏸ 자동재생 중' : '▶ 자동재생';
    scheduleAuto();
  }

  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  document.getElementById('replay').onclick = () => go(cur);
  document.getElementById('auto').onclick = () => setAuto(!autoOn);
  document.getElementById('fs').onclick = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.getElementById('app').requestFullscreen?.(); p?.catch?.(() => {}); }
    } catch (e) {}
  };
  els[0].querySelector('#startBtn').addEventListener('click', () => go(1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  });

  go(0);
  setAuto(true);
})();
</script>
</body>
</html>
